# The tag registry: the only tags that may reach an item.
#
# A starting point, not a standard. Cut what does not apply to your library,
# rename what your creators call something else, and add through the pipeline —
# `inductor tagmap` for a creator's vocabulary, `inductor adjudicate` for what a
# run proposes — so the decision is recorded in state/decisions/ rather than
# just happening.
#
# Eight kinds. The seven prefixed ones answer a fixed question about every
# recording; `content` is the open one. Keep the prefixed lists short: a
# vocabulary that fits in the head is one people actually use.
#
# Quote any tag name YAML would read as a number or a boolean — '69', not 69.
# An unquoted numeric key makes its whole block unreadable to Inductor.
apiVersion: hypnotica/v1
kind: Tags

voice:
  _about: The speaker's gender expression. Not a claim about anyone's body.
  fem: Speaker presents feminine.
  masc: Speaker presents masculine.
  transfem: Speaker presents transfeminine.
  transmasc: Speaker presents transmasculine.
  androgynous: Speaker's presentation is deliberately neither, or unreadable.

audience:
  _about: Who the recording addresses. Use anyone when it does not say.
  man: Addressed to a man.
  woman: Addressed to a woman.
  transfem: >-
    Addressed to a trans woman, as herself — transition, becoming, being a woman.
    Not the sissy frame: see sissy.
  sissy: >-
    Addressed to a man being feminised, in the sissy kink sense — a feminised
    male, named as such. A kink about being made into a woman, not about being
    one.
  transmasc: Addressed to a transmasculine listener.
  enby: Addressed to a nonbinary listener.
  couple: Addressed to two listeners together.
  anyone: No gendered address, or explicitly open to all.

induction:
  _about: How the recording brings on trance. One per file unless it genuinely switches.
  Nothing: No induction. The recording begins in scene or speech.
  Conversational: Trance arrives through ordinary talk, with no announced induction.
  Covert: Trance induced without naming it, on a listener not told to expect it.
  Ericksonian: Indirect, permissive suggestion; metaphor and implication rather than command.
  Betty Erickson: The self-hypnosis pattern of naming things seen, heard and felt, counting down each pass.
  Elman: The rapid clinical induction — eye catalepsy, then a deepening count.
  Fixation: Attention held on one object, image or body part until focus narrows.
  Visualisation: A guided scene the listener builds and descends into.
  Gateway: Passage through an imagined door, gate or threshold into trance.
  Counting: A counted descent, usually downward, each number deepening.
  Breathing: Paced or directed breath used to carry the listener down.
  Progressive Muscle Relaxation: Tense and release each muscle group in turn.
  Repetition: The same phrase or cadence repeated until it stops being parsed.
  Yes Set: A run of statements the listener cannot help agreeing with, so the next one lands.
  Confusion: Deliberate overload of contradictory or tangled instruction until the mind gives up tracking.
  Overload: Several channels at once — counting while visualising while breathing, past what attention holds.
  Fractionation: Repeatedly surfacing and dropping again, each pass going deeper.
  Hand Drop: The hand held up, falling as trance takes hold.
  Shock: An abrupt word or sound that drops the listener without warning.
  Brainwashing: The induction is itself the conditioning; repetition and assertion, not relaxation.

production:
  _about: How the audio was made or delivered — not what happens in it.
  ASMR: Deliberate tingle-triggering sound design.
  Whispers: Delivered wholly or largely in a whisper.
  Softly Spoken: Quiet, close delivery, short of whispering.
  Breathy: Audible breath used as texture.
  Accent: An accent is part of the delivery.
  Fast Speech: Deliberately rapid delivery.
  Sleepy Voice: A just-woken or drowsy voice.
  Tone Shift: The speaker's register changes deliberately mid-file.
  Processed Voice: The voice is digitally altered — pitch-shifted, robotic or otherwise effected.
  Synthesised: Voice generated rather than recorded.
  Layered Voices: More than one voice track at once, overlapping.
  Ear to Ear: Sound moving between the ears, close on each side.
  Spatial Audio: Positional audio that moves around the listener.
  Binaural: Two tones offset between channels to produce a beat frequency.
  No Binaural: States it contains no binaural content.
  Subliminals: Content mixed below conscious hearing, whether or not it works.
  No Subliminals: States it contains no subliminal content.
  Music: Scored with music under the voice.
  Background: Ambient environment audio under the voice.
  Soundscape: The environment is the content, not a bed under speech.
  Sound Effects: Discrete effects used to stage action.
  Wet Sounds: Close mouth and body sounds foregrounded.
  Echo: Echo or reverb used as an effect.
  Haptics: Sound designed to be felt, usually low frequency, often with a toy.
  Naked Audio: Voice alone, with no music, effects, ambience or processing added.
  Singing: The speaker sings.
  No Speech: Contains no words; voice sound or ambience alone.
  Monologue: One unbroken solo address, with no scene, dialogue or interaction.
  Affirmations: A list of statements to absorb or repeat, rather than a scene.
  Mantras: Phrases given for the listener to say back.
  Loop: Built to repeat seamlessly, with no beginning or end.
  Live: Recorded in one unedited take, or captured from a live session.
  Improvised: Unscripted, made up as it goes.
  Script Fill: The speaker is performing someone else's script.
  Collab: More than one creator performs.
  Bilingual: Two languages are used within the recording.
  Aphantasia-Friendly: Written to work without the listener picturing anything.

compulsion:
  _about: A drive the recording means to leave behind, aimed at an action in the world.
  Relisten: Play this recording again, often on a schedule or when a feeling arrives.
  Edge: Approach orgasm without finishing, later and away from the recording.
  Abstain: Hold off from release, or from touching at all, until permitted.
  Contact: Get in touch with the creator.
  Spend: Buy, tip or tribute.
  Share: Pass the recording or the trigger to someone else.

trigger:
  _about: >-
    A cue the recording installs so that later, outside the session, the cue
    produces the effect. Name the trigger by its cue word. Descriptions here are
    the common usage; a given file may bind the same word to something else, so
    the item's own spoiler text is what governs.
  Drop: Drops the listener into trance on the word.
  Sink: Deepens trance; sinking down further on the word.
  Deeper: Deepens trance a step on the word.
  Fall: Drops the listener, framed as falling.
  Click: A snap or click that drops or switches state instantly.
  Blank: Thought stops on the word.
  Mindless: Thought stops and the listener becomes compliant with it.
  Bliss: Floods the listener with pleasure on the word.
  Freeze: Holds the listener still on the word.
  Play/Pause: Starts and stops a state like a transport control.
  Focus and Obey: Narrows attention and produces compliance together.
  Take Control: Hands control of the listener over on the cue.
  Good Girl: Praise cue producing pleasure, addressed to a female listener.
  Good Boy: Praise cue producing pleasure, addressed to a male listener.
  Good Sub: Praise cue producing pleasure and reinforcement, ungendered.
  Good Enby: Praise cue producing pleasure, addressed to a nonbinary listener.
  Stroke: Compels the listener to touch themselves.
  Cum: Produces orgasm on the word.
  Drip: Produces wetness or leaking on the word.
  Beg: Produces begging from the listener.
  Speak: Compels speech from the listener.
  Sleep: Sends the listener into sleep on the word.
  Voice: The speaker's voice itself is the cue.
  Rise: Brings the listener up out of trance a step.
  Pop: Returns the listener to waking, or pops a state.
  Wake: Returns the listener fully to waking.
  Break: Cancels a state or trigger; the safety cue in many files.

cw:
  _about: >-
    Things a recording mentions or brushes against rather than dwells on. A
    content tag says what the recording is; a CW says what a listener might want
    warning of before pressing play.
  Blood: Blood appears, as something the recording touches on.
  Gore: Graphic injury or viscera, as something the recording touches on.
  Violence: Violence done to a character or the listener, as something the recording touches on.
  Death: Death, dying or bereavement, as something the recording touches on.
  Suicide: Suicide or suicidal feeling, as something the recording touches on.
  Self-Harm: Self-harm, cutting or the urge to, as something the recording touches on.
  Non-Consent: Consent withheld, ignored or absent, as something the recording touches on.
  Incest: Family sexual contact, as something the recording touches on.
  Sadism: Cruelty or enjoyment of suffering, as something the recording touches on.
  Stalking: Stalking or being followed, as something the recording touches on.
  Drugs: Drugs or intoxication, as something the recording touches on.
  Needles: Needles or injections, as something the recording touches on.
  Disordered Eating: Dieting, weight or food restriction, as something the recording touches on.
  Pregnancy: Pregnancy or its risk, as something the recording touches on.

